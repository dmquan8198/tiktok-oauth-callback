<h1>Đã nhận phản hồi từ TikTok</h1>
<p>Trang này không làm gì cả. Hãy <strong>sao chép toàn bộ địa chỉ</strong> trên thanh địa chỉ của trình duyệt (dạng <code>...?code=...&amp;state=...</code>) và dán vào cửa sổ terminal đang chạy <code>npm run tiktok:auth</code>.</p>
<p>Địa chỉ này chứa mã dùng một lần. Đừng gửi hay chia sẻ cho ai khác.</p>
